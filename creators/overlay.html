<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Giveaway Pulse OBS Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#f5fff8;font-family:Inter,system-ui,Arial,sans-serif}.stage{width:100%;height:100%;display:grid;place-items:center;padding:28px}.card{width:min(920px,100%);padding:36px 42px;border:1px solid #b9ff6580;border-radius:28px;background:linear-gradient(130deg,rgba(6,17,12,.94),rgba(11,25,35,.92));box-shadow:0 18px 80px #0008;text-align:center}.brand{font-size:13px;font-weight:850;letter-spacing:.22em;text-transform:uppercase;color:#b9ff65}.title{font-size:clamp(20px,3vw,36px);font-weight:750;margin:18px 0 12px;color:#d8e5dd}.winner{font-size:clamp(36px,6vw,78px);line-height:1.05;font-weight:900;letter-spacing:-.05em;overflow-wrap:anywhere;margin:16px 0}.sub{font-size:13px;color:#a3b7aa;letter-spacing:.08em;text-transform:uppercase}@media(max-width:560px){.card{padding:24px 18px;border-radius:18px}}
</style></head><body><main class="stage"><section class="card"><div class="brand">Giveaway Pulse · Winner reveal</div><div class="title" id="title">Your giveaway</div><div class="winner" id="winner">Winner name</div><div class="sub" id="sub">Official draw result</div></section></main><script>
const q=new URLSearchParams(location.search);function safe(id,v){document.getElementById(id).textContent=v;}safe('title',q.get('title')||'Your giveaway');safe('winner',q.get('winner')||'Winner name');safe('sub',q.has('count')?q.get('count')+' eligible entries · Draw result':'Official draw result');
</script></body></html>
