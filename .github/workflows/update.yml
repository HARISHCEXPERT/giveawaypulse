name: Update giveaways

on:
  schedule:
    - cron: "17 * * * *"   # har ghante
  push:
    paths:
      - "posts/**"          # naya giveaway page daalte hi turant ban jaye
      - "site-config.json"
  workflow_dispatch:        # GitHub par haath se bhi chala sakte ho

permissions:
  contents: write

concurrency:
  group: update-giveaways
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch giveaways (radar)
        if: github.event_name != 'push'
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node fetch.js
      - name: Build giveaway pages
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node build-posts.js
      - name: Commit
        run: |
          git config user.name "giveaway-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -m "update giveaways"
          git pull --rebase origin ${{ github.ref_name }}
          git push
